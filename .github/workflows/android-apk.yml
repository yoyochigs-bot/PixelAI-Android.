
name: Build Pixel AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q PixelAI_Android_Project.zip

      - name: Build APK
        run: |
          cd PixelAI_Android_Project
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PixelAI-debug-APK
          path: PixelAI_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
